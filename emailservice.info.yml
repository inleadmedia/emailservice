name: 'Email Subscription Manager'
description: 'Allow citizens in the Danish municipals subscribe to preference-controlled email notifications with new arrivals to their local library.'
package: 'Email Service'
type: module
core_version_requirement: ^9 || ^10 || ^11
dependencies:
  - drupal:color_field
  - drupal:field_group
  - drupal:admin_toolbar
  - drupal:admin_toolbar_tools
  - drupal:node
  - drupal:user
  - drupal:path_alias
